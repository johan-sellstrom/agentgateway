[package]
name = "haps-guard"
description = "Experimental mcpGuardrails processor requiring a HAPS Consent Credential bound to the exact MCP tool call; not production-ready"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "haps-guard"
path = "src/main.rs"

# Test trust anchors and approvals for the lab deployment in deploy/gcp (see its README).
# An example so it uses the guard's own canonicaliser, hash and Signing View derivation.
[[example]]
name = "haps-mint"
path = "../../deploy/gcp/mint/haps_mint.rs"

[dependencies]
anyhow.workspace = true
# Data Integrity proof verification for vc+json credentials (Ed25519, P-256).
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
prost-wkt-types.workspace = true
protos.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The shared replay and challenge store. Optional at runtime: the in-memory store needs none.
reqwest = { workspace = true, features = ["json"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "cluster-async", "sentinel"] }

# The HAPS canonicalizer and hash, from the public HAPS reference repository at a pinned
# commit, rather than vendored: the Lean and Kani results apply to these crates, and a copy
# would silently stop being the checked artifact. At this commit their trees are identical
# (same git tree hashes) to the HAPP-reference copy the guard was first built against.
haps-canon = { git = "https://github.com/iProov/HAPS-reference", rev = "fb15eac5773ae113bd62fdf1ac798217415a3f8f" }
haps-hash = { git = "https://github.com/iProov/HAPS-reference", rev = "fb15eac5773ae113bd62fdf1ac798217415a3f8f" }

[dev-dependencies]
tempfile.workspace = true
